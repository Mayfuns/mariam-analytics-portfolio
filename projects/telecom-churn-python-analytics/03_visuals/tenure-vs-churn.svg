  <text x="60" y="92" font-family="Arial" font-size="19" fill="#607389">Customers in months 0–12 recorded the highest tenure-band churn rate.</text>
  <text x="252" y="173" text-anchor="end" font-family="Arial" font-size="22" fill="#0f2e4f">0–12 months</text><rect x="270" y="148" width="730" height="34" rx="8" fill="#e8eef5"/><rect x="270" y="148" width="626.2" height="34" rx="8" fill="#4f8cff"/><text x="908.1777777777778" y="173" font-family="Arial" font-size="20" font-weight="700" fill="#173b63">38.6%</text><text x="252" y="275.5" text-anchor="end" font-family="Arial" font-size="22" fill="#0f2e4f">13–24 months</text><rect x="270" y="250.5" width="730" height="34" rx="8" fill="#e8eef5"/><rect x="270" y="250.5" width="45.4" height="34" rx="8" fill="#4f8cff"/><text x="327.4222222222222" y="275.5" font-family="Arial" font-size="20" font-weight="700" fill="#173b63">2.8%</text><text x="252" y="378" text-anchor="end" font-family="Arial" font-size="22" fill="#0f2e4f">25–36 months</text><rect x="270" y="353" width="730" height="34" rx="8" fill="#e8eef5"/><rect x="270" y="353" width="306.6" height="34" rx="8" fill="#4f8cff"/><text x="588.5999999999999" y="378" font-family="Arial" font-size="20" font-weight="700" fill="#173b63">18.9%</text><text x="252" y="480.5" text-anchor="end" font-family="Arial" font-size="22" fill="#0f2e4f">37+ months</text><rect x="270" y="455.5" width="730" height="34" rx="8" fill="#e8eef5"/><rect x="270" y="455.5" width="214.1" height="34" rx="8" fill="#4f8cff"/><text x="496.1333333333333" y="480.5" font-family="Arial" font-size="20" font-weight="700" fill="#173b63">13.2%</text>
  <text x="270" y="592" font-family="Arial" font-size="17" fill="#718197">Churn rate</text>
