name: Build social preview
on:
  push:
    paths:
      - '.github/workflows/build-social-preview.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create social preview image
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W,H=1200,630
          bg=(7,17,31)
          im=Image.new("RGB",(W,H),bg)
          d=ImageDraw.Draw(im)

          # restrained blue/cyan atmosphere
          for i in range(360):
              a=i/360
              x=840+i
              if x<W:
                  d.line((x,0,x,H),fill=(8+int(5*a),27+int(28*a),47+int(28*a)))
          for r,alpha in [(250,20),(190,28),(130,36)]:
              box=(920-r,35,920+r,35+2*r)
              d.ellipse(box,outline=(18,78+alpha,98+alpha),width=2)

          reg="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          f_name=ImageFont.truetype(reg,27)
          f_big=ImageFont.truetype(bold,54)
          f_big2=ImageFont.truetype(bold,51)
          f_tool=ImageFont.truetype(reg,22)
          f_card=ImageFont.truetype(bold,19)
          f_small=ImageFont.truetype(reg,16)

          white=(248,250,252); cyan=(34,184,207); blue=(79,140,255); muted=(166,183,202)
          d.text((72,60),"MARIAM ADETOYI",font=f_name,fill=white)
          d.rounded_rectangle((72,103,250,107),2,fill=cyan)
          d.text((72,142),"DATA ANALYTICS &",font=f_big,fill=white)
          d.text((72,205),"BUSINESS INTELLIGENCE",font=f_big2,fill=cyan)
          d.text((72,266),"PORTFOLIO",font=f_big,fill=white)
          d.text((72,338),"Power BI  •  Tableau  •  SQL  •  Excel",font=f_tool,fill=muted)

          # human-designed card row
          cards=[(72,"POWER BI","Dashboards & KPI reporting"),
                 (386,"TABLEAU","Visual analytics & storytelling"),
                 (700,"SQL & EXCEL","Analysis, queries & reporting")]
          for x,title,sub in cards:
              y=405; w=278; h=138
              d.rounded_rectangle((x,y,x+w,y+h),16,fill=(12,29,48),outline=(31,61,91),width=2)
              d.text((x+20,y+18),title,font=f_card,fill=white)
              d.text((x+20,y+48),sub,font=f_small,fill=muted)
              # miniature chart
              base=y+112
              vals=[36,58,44,76,64]
              for j,v in enumerate(vals):
                  bx=x+22+j*43
                  d.rounded_rectangle((bx,base-v//2,bx+24,base),5,fill=cyan if j in (1,3) else blue)
              d.line((x+20,base+8,x+w-20,base+8),fill=(41,68,95),width=1)

          d.text((1010,430),"TURNING",font=f_small,fill=muted)
          d.text((1010,454),"DATA INTO",font=f_small,fill=muted)
          d.text((1010,486),"CLEARER",font=f_card,fill=cyan)
          d.text((1010,514),"DECISIONS",font=f_card,fill=cyan)

          Path("assets/images").mkdir(parents=True,exist_ok=True)
          im.save("assets/images/social-preview.png",optimize=True)
          PY
      - name: Commit social preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Add portfolio social preview image"
            git push
          fi
